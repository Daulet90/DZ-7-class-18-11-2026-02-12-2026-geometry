<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Геометрия ҮТ 7Ә – мұғалімге</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f8fafc;--card:#fff;--grid:#d6e2f0;--ink:#1b2a49;--mute:#5b6b86;--red:#c0392b;--ok:#17724a;--okbg:#e8f5ee;--line:#c9d6e6;--tint:rgba(27,42,73,.06)}
@media (prefers-color-scheme:dark){:root{--paper:#121a2b;--card:#18223a;--grid:#243150;--ink:#e6ecf7;--mute:#9db0cf;--red:#ef6b5c;--ok:#5fd29b;--okbg:#14301f;--line:#2e3d60;--tint:rgba(230,236,247,.07)}}
*{box-sizing:border-box}html,body{margin:0}
body{font:17px/1.65 "PT Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{border-right:3px double var(--red);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font:700 21px/1.25 "PT Serif",Georgia,serif;margin:0 0 4px}
aside .meta{color:var(--mute);font-size:15px;margin:0 0 20px}
nav{display:flex;flex-direction:column;gap:8px}
nav button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}
nav button b{font:700 20px "PT Serif",Georgia,serif}nav button span{color:var(--mute);font-size:14px}
nav button[aria-current=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav button[aria-current=true] span{color:inherit;opacity:.8}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{padding:36px clamp(18px,5vw,64px);max-width:900px}
.date{color:var(--mute);margin:0}
h2{font:700 clamp(24px,3.4vw,32px)/1.25 "PT Serif",Georgia,serif;margin:4px 0 22px}
.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:20px 24px;font-size:20px;line-height:1.7}
.fig{margin:20px 0;border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;justify-content:center;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.fig svg{width:100%;max-width:520px;height:auto}
.fig .s{fill:var(--tint);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.fig .t{stroke:var(--red);stroke-width:2.2}.fig .a{stroke:var(--red);stroke-width:2;fill:none}
.fig .d{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5}
.fig .v{font:700 19px "PT Serif",Georgia,serif;fill:var(--ink);font-style:italic}.fig .g{font:700 15px "PT Sans",sans-serif;fill:var(--red)}
.cap{color:var(--mute);font-size:14px;text-align:center;margin:-8px 0 20px}
.sol{background:var(--okbg);border-left:5px solid var(--ok);border-radius:6px;padding:16px 24px;margin-top:22px}
.sol h3{margin:0 0 6px;font:700 19px "PT Serif",Georgia,serif;color:var(--ok)}
.sol ol{margin:0;padding-left:22px}.sol li{margin:6px 0}
.sol .ans{margin:12px 0 0;font-weight:700;font-size:19px}
@media (max-width:760px){.app{display:block}aside{position:static;height:auto;border-right:0;border-bottom:3px double var(--red);padding:16px}
nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}nav button{flex:0 0 auto;flex-direction:column;gap:0}}
@media print{aside{display:none}.app{display:block}}
</style></head><body>
<div class="app"><aside><h1>Геометрия: үй тапсырмасы</h1><p class="meta">7Ә сынып · мұғалімге (шешуімен)<br>Мұғалім: Кунгозин Даулет Багдашұлы</p><nav id="nav" aria-label="Күндер"></nav></aside>
<main><p class="date" id="date"></p><h2 id="topic"></h2><div class="task" id="task"></div><div class="fig" id="fig"></div><p class="cap">Сурет масштабсыз сызылған</p><div id="sol"></div></main></div>

const D=[{"d": "18.11.2026", "w": "Сәрсенбі", "s": "18.11", "t": "Үшбұрыштар теңдігінің үшінші белгісі", "q": "ABC және DEF үшбұрыштарында AB = DE = 5 см, BC = EF = 6 см, AC = DF = 7 см. ∠B = 70° болса, ∠E неге тең? Жауабыңды негізде.", "svg": "<svg viewBox=\"0 0 470 185\" role=\"img\" aria-label=\"ABC және DEF үшбұрыштары\"><polygon points=\"20,150 88,45 195,150\" class=\"s\"/><polygon points=\"270,150 338,45 445,150\" class=\"s\"/><line x1=\"48.96386626663051\" y1=\"94.2385038679131\" x2=\"59.03613373336949\" y2=\"100.7614961320869\" class=\"t\"/><line x1=\"298.96386626663053\" y1=\"94.2385038679131\" x2=\"309.03613373336947\" y2=\"100.7614961320869\" class=\"t\"/><line x1=\"143.20431833523205\" y1=\"90.76610818232191\" x2=\"134.79946079162195\" y2=\"99.3310582505722\" class=\"t\"/><line x1=\"148.20053920837805\" y1=\"95.6689417494278\" x2=\"139.79568166476795\" y2=\"104.23389181767809\" class=\"t\"/><line x1=\"393.2043183352321\" y1=\"90.76610818232191\" x2=\"384.799460791622\" y2=\"99.3310582505722\" class=\"t\"/><line x1=\"398.200539208378\" y1=\"95.6689417494278\" x2=\"389.7956816647679\" y2=\"104.23389181767809\" class=\"t\"/><line x1=\"100.5\" y1=\"144.0\" x2=\"100.5\" y2=\"156.0\" class=\"t\"/><line x1=\"107.5\" y1=\"144.0\" x2=\"107.5\" y2=\"156.0\" class=\"t\"/><line x1=\"114.5\" y1=\"144.0\" x2=\"114.5\" y2=\"156.0\" class=\"t\"/><line x1=\"350.5\" y1=\"144.0\" x2=\"350.5\" y2=\"156.0\" class=\"t\"/><line x1=\"357.5\" y1=\"144.0\" x2=\"357.5\" y2=\"156.0\" class=\"t\"/><line x1=\"364.5\" y1=\"144.0\" x2=\"364.5\" y2=\"156.0\" class=\"t\"/><path d=\"M73.9,66.8 A26,26 0 0 0 106.6,63.2\" class=\"a\"/><text x=\"93.1\" y=\"95.7\" class=\"g\" text-anchor=\"middle\">70°</text><path d=\"M323.9,66.8 A26,26 0 0 0 356.6,63.2\" class=\"a\"/><text x=\"343.1\" y=\"95.7\" class=\"g\" text-anchor=\"middle\">70°</text><text x=\"8.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">A</text><text x=\"88.0\" y=\"35.0\" class=\"v\" text-anchor=\"middle\">B</text><text x=\"207.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">C</text><text x=\"258.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">D</text><text x=\"338.0\" y=\"35.0\" class=\"v\" text-anchor=\"middle\">E</text><text x=\"457.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">F</text></svg>", "steps": ["Екі үшбұрыштың үш қабырғасы өзара тең: AB = DE, BC = EF, AC = DF.", "Үшбұрыштар теңдігінің үшінші белгісі (үш қабырғасы бойынша) бойынша △ABC = △DEF.", "Тең үшбұрыштарда сәйкес бұрыштар тең. ∠B қабырғасы AC-ға қарсы жатыр, ∠E бұрышы DF-ке қарсы жатыр, ал AC = DF. Демек, ∠E = ∠B."], "a": "∠E = 70°"}, {"d": "20.11.2026", "w": "Жұма", "s": "20.11", "t": "Үшбұрыштар теңдігінің белгілерін дәлелдеуге берілген есептер", "q": "ABCD төртбұрышында AB = CD, BC = AD. AC диагоналі жүргізілген. ABC және CDA үшбұрыштарының тең екенін дәлелде.", "svg": "<svg viewBox=\"0 0 330 175\" role=\"img\" aria-label=\"ABCD төртбұрышы және AC диагоналі\"><polygon points=\"40,140 110,35 290,35 220,140\" class=\"s\"/><line x1=\"40\" y1=\"140\" x2=\"290\" y2=\"35\" class=\"d\"/><line x1=\"70.00769823397293\" y1=\"84.17179882264863\" x2=\"79.99230176602707\" y2=\"90.82820117735137\" class=\"t\"/><line x1=\"259.9923017660271\" y1=\"90.82820117735137\" x2=\"250.00769823397295\" y2=\"84.17179882264863\" class=\"t\"/><line x1=\"196.5\" y1=\"29.0\" x2=\"196.5\" y2=\"41.0\" class=\"t\"/><line x1=\"203.5\" y1=\"29.0\" x2=\"203.5\" y2=\"41.0\" class=\"t\"/><line x1=\"126.5\" y1=\"134.0\" x2=\"126.5\" y2=\"146.0\" class=\"t\"/><line x1=\"133.5\" y1=\"134.0\" x2=\"133.5\" y2=\"146.0\" class=\"t\"/><line x1=\"156.22273035461794\" y1=\"84.67873475684148\" x2=\"160.86952016687903\" y2=\"95.7425200241298\" class=\"t\"/><line x1=\"162.67660509386945\" y1=\"81.96810736635584\" x2=\"167.32339490613055\" y2=\"93.03189263364416\" class=\"t\"/><line x1=\"169.13047983312097\" y1=\"79.2574799758702\" x2=\"173.77726964538206\" y2=\"90.32126524315852\" class=\"t\"/><text x=\"28.0\" y=\"146.0\" class=\"v\" text-anchor=\"middle\">A</text><text x=\"102.0\" y=\"25.0\" class=\"v\" text-anchor=\"middle\">B</text><text x=\"300.0\" y=\"25.0\" class=\"v\" text-anchor=\"middle\">C</text><text x=\"232.0\" y=\"148.0\" class=\"v\" text-anchor=\"middle\">D</text></svg>", "steps": ["AB = CD және BC = AD (шарт бойынша).", "AC қабырғасы – екі үшбұрыш үшін ортақ қабырға.", "△ABC және △CDA үшбұрыштарының үш қабырғасы тең: AB = CD, BC = DA, AC = CA. Үшінші белгі бойынша △ABC = △CDA."], "a": "△ABC = △CDA (дәлелденді)"}, {"d": "25.11.2026", "w": "Сәрсенбі", "s": "25.11", "t": "Теңбүйірлі үшбұрыш және оның қасиеттері", "q": "ABC теңбүйірлі үшбұрышында AB = BC, ∠A = 50°. ∠B және ∠C бұрыштарын тап.", "svg": "<svg viewBox=\"0 0 250 185\" role=\"img\" aria-label=\"ABC теңбүйірлі үшбұрышы\"><polygon points=\"30,150 125,30 220,150\" class=\"s\"/><line x1=\"72.79572505322943\" y1=\"86.27578233380663\" x2=\"82.20427494677057\" y2=\"93.72421766619337\" class=\"t\"/><line x1=\"177.20427494677057\" y1=\"86.27578233380663\" x2=\"167.79572505322943\" y2=\"93.72421766619337\" class=\"t\"/><path d=\"M48.6,126.5 A30,30 0 0 1 60.0,150.0\" class=\"a\"/><text x=\"76.8\" y=\"132.4\" class=\"g\" text-anchor=\"middle\">50°</text><path d=\"M107.6,52.0 A28,28 0 0 0 142.4,52.0\" class=\"a\"/><text x=\"125.0\" y=\"85.0\" class=\"g\" text-anchor=\"middle\">80°</text><path d=\"M190.0,150.0 A30,30 0 0 1 201.4,126.5\" class=\"a\"/><text x=\"173.2\" y=\"132.4\" class=\"g\" text-anchor=\"middle\">50°</text><text x=\"18.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">A</text><text x=\"125.0\" y=\"20.0\" class=\"v\" text-anchor=\"middle\">B</text><text x=\"232.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">C</text></svg>", "steps": ["Теңбүйірлі үшбұрыштың табанындағы бұрыштары тең. Табаны – AC, сондықтан ∠C = ∠A = 50°.", "Үшбұрыш бұрыштарының қосындысы 180°: ∠B = 180° − 50° − 50° = 80°."], "a": "∠C = 50°, ∠B = 80°"}, {"d": "27.11.2026", "w": "Жұма", "s": "27.11", "t": "Теңбүйірлі үшбұрыштың қасиеттерін қолдануға есептер шығару", "q": "ABC теңбүйірлі үшбұрышының табаны AC, BD – биссектриса, AD = 7 см. AC кесіндісінің ұзындығын және ∠BDC бұрышын тап.", "svg": "<svg viewBox=\"0 0 260 195\" role=\"img\" aria-label=\"ABC теңбүйірлі үшбұрышы, BD биссектриса\"><polygon points=\"30,150 130,30 230,150\" class=\"s\"/><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"150\" class=\"d\"/><line x1=\"75.39067232241574\" y1=\"86.15889360201312\" x2=\"84.60932767758426\" y2=\"93.84110639798688\" class=\"t\"/><line x1=\"184.60932767758425\" y1=\"86.15889360201312\" x2=\"175.39067232241575\" y2=\"93.84110639798688\" class=\"t\"/><path d=\"M110.8,53.0 A30,30 0 0 0 130.0,60.0\" class=\"a\"/><path d=\"M130.0,60.0 A30,30 0 0 0 149.2,53.0\" class=\"a\"/><text x=\"80.0\" y=\"172.0\" class=\"g\" text-anchor=\"middle\">7 см</text><line x1=\"76.5\" y1=\"144.0\" x2=\"76.5\" y2=\"156.0\" class=\"t\"/><line x1=\"83.5\" y1=\"144.0\" x2=\"83.5\" y2=\"156.0\" class=\"t\"/><line x1=\"176.5\" y1=\"144.0\" x2=\"176.5\" y2=\"156.0\" class=\"t\"/><line x1=\"183.5\" y1=\"144.0\" x2=\"183.5\" y2=\"156.0\" class=\"t\"/><polyline points=\"130.0,137.0 143.0,137.0 143.0,150.0\" class=\"a\"/><text x=\"180.0\" y=\"172.0\" class=\"g\" text-anchor=\"middle\">7 см</text><text x=\"18.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">A</text><text x=\"130.0\" y=\"20.0\" class=\"v\" text-anchor=\"middle\">B</text><text x=\"242.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">C</text><text x=\"130.0\" y=\"172.0\" class=\"v\" text-anchor=\"middle\">D</text></svg>", "steps": ["Теңбүйірлі үшбұрышта табанына жүргізілген биссектриса – медиана да, биіктік те болады.", "BD – медиана, сондықтан AD = DC = 7 см, AC = 7 + 7 = 14 см.", "BD – биіктік, сондықтан BD ⊥ AC, яғни ∠BDC = 90°."], "a": "AC = 14 см, ∠BDC = 90°"}, {"d": "02.12.2026", "w": "Сәрсенбі", "s": "02.12", "t": "Теңбүйірлі үшбұрыштың белгілерін қолдану", "q": "ABC үшбұрышында ∠A = 40°, ∠B = 100°, AB = 8 см. BC қабырғасының ұзындығын тап.", "svg": "<svg viewBox=\"0 0 260 175\" role=\"img\" aria-label=\"ABC үшбұрышы\"><polygon points=\"30,150 130,66 230,150\" class=\"s\"/><path d=\"M54.5,129.4 A32,32 0 0 1 62.0,150.0\" class=\"a\"/><text x=\"80.7\" y=\"136.5\" class=\"g\" text-anchor=\"middle\">40°</text><path d=\"M110.1,82.7 A26,26 0 0 0 149.9,82.7\" class=\"a\"/><text x=\"130.0\" y=\"121.0\" class=\"g\" text-anchor=\"middle\">100°</text><text x=\"62.0\" y=\"95.0\" class=\"g\" text-anchor=\"middle\">8 см</text><path d=\"M198.0,150.0 A32,32 0 0 1 205.5,129.4\" class=\"a\"/><text x=\"179.3\" y=\"136.5\" class=\"g\" text-anchor=\"middle\">40°</text><line x1=\"76.14084748146036\" y1=\"103.40577081126233\" x2=\"83.85915251853964\" y2=\"112.59422918873767\" class=\"t\"/><line x1=\"183.85915251853964\" y1=\"103.40577081126233\" x2=\"176.14084748146036\" y2=\"112.59422918873767\" class=\"t\"/><text x=\"198.0\" y=\"95.0\" class=\"g\" text-anchor=\"middle\">8 см</text><text x=\"18.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">A</text><text x=\"130.0\" y=\"56.0\" class=\"v\" text-anchor=\"middle\">B</text><text x=\"242.0\" y=\"156.0\" class=\"v\" text-anchor=\"middle\">C</text></svg>", "steps": ["∠C = 180° − 40° − 100° = 40°.", "∠A = ∠C = 40°, яғни үшбұрыштың екі бұрышы тең. Теңбүйірлі үшбұрыш белгісі бойынша △ABC – теңбүйірлі, табаны AC.", "Тең бұрыштарға қарсы жатқан қабырғалар тең: ∠C-ға қарсы AB, ∠A-ға қарсы BC жатыр. Демек, BC = AB = 8 см."], "a": "BC = 8 см"}];
const nav=document.getElementById('nav');
D.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML='<b>'+d.s+'</b><span>'+d.w+'</span>';b.onclick=()=>show(i,true);nav.appendChild(b)});
function show(i,push){
 const d=D[i];
 [...nav.children].forEach((b,k)=>b.setAttribute('aria-current',k===i));
 document.getElementById('date').textContent=d.w+', '+d.d;
 document.getElementById('topic').textContent=d.t;
 document.getElementById('task').textContent=d.q;
 document.getElementById('fig').innerHTML=d.svg;
 let h='';
 if(TEACHER){h='<div class="sol"><h3>Шешуі</h3><ol>'+d.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><p class="ans">Жауабы: '+d.a+'</p></div>'}
 document.getElementById('sol').innerHTML=h;
 if(push)try{history.replaceState(null,'','#'+d.s.replace('.','-'))}catch(e){}
}
const now=new Date(),td=String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+now.getFullYear();
let st=D.findIndex(d=>'#'+d.s.replace('.','-')===location.hash);
if(st<0)st=D.findIndex(d=>d.d===td);
show(st<0?0:st,false);
</script></body></html>
